name: Update session status

on:
  schedule:
    # every two hours
    - cron: '26 */8 * * *'
      timezone: America/Los_Angeles
  push:
    branches: [ "main" ]
    paths:
      - 'tracked_sessions.yaml'
    tags:        
      - '*'           # Push events to every tag not containing /
  
  workflow_dispatch:

concurrency:
  group: update-session-status
  cancel-in-progress: false

jobs:
  package:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11"]
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package
      run: |
        pip install -e .[polars]
        pip install "plotly==5.24.1" "kaleido==0.2.1"

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Configure aws credentials
      env:
        AWS_IAM_ROLE: ${{ vars.AWS_IAM_ROLE }}
        AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ vars.AWS_IAM_ROLE }}
        aws-region: ${{ vars.AWS_DEFAULT_REGION }}
    - name: Update session status
      env:
        DBHUB_API_KEY: ${{ secrets.DBHUB_API_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        CODE_OCEAN_API_TOKEN: ${{ secrets.CODE_OCEAN_API_TOKEN }}
        CODE_OCEAN_DOMAIN: ${{ secrets.CODE_OCEAN_DOMAIN }}
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        REDIS_DEFAULT_USER_PASSWORD: ${{ secrets.REDIS_DEFAULT_USER_PASSWORD }}
      run: |
        update_session_status --csv-output-path tables/status.csv
        python src/npc_lims/scripts/plot_session_status.py \
          --output /tmp/session_status_sankey.html \
          --svg tables/status.svg
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add tables/status.csv tables/status.svg
        git diff --cached --quiet || git commit -m "Update session status table and plot"
        uv run --script src/npc_lims/scripts/completeness_dashboard.py
        git add tables/dashboard.html
        git diff --cached --quiet || git commit -m "Update session status completeness dashboard"
        git fetch origin main
        git rebase origin/main
        git push origin HEAD:main
